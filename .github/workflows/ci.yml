name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-checks:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      SECRET_KEY: django-insecure-ci-key
      LANGUAGE_CODE: en
      TIME_ZONE: UTC
      SITE_ID: 1
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django deployment checks
        env:
          ENVIRONMENT: production
          SECRET_KEY: ci-production-secret-key-with-adequate-length-and-entropy-1234567890
          ALLOWED_HOSTS: 127.0.0.1,localhost
          CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          CACHE_BACKEND: django.core.cache.backends.locmem.LocMemCache
          ALLOW_PRODUCTION_LOCMEM_CACHE: "True"
          DB_NAME: ci_dummy
          DB_USER: ci_dummy
          DB_PASSWORD: ci_dummy
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          STATIC_ROOT: /tmp/tvt-static
          MEDIA_ROOT: /tmp/tvt-media
          LOG_FILE_PATH: /tmp/tvt-error.log
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
          SECURE_SSL_REDIRECT: "True"
          X_FRAME_OPTIONS: DENY
        run: python manage.py check --deploy --fail-level WARNING

      - name: Compile translations
        run: python manage.py compilemessages

      - name: Run test suite
        run: python manage.py test

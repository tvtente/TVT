{% load i18n %}

<div class="card mb-4 shadow-sm border-0">
    <h5 class="card-header p-0">
        <button class="btn btn-light w-100 text-start d-flex justify-content-between align-items-center"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapse-widget-{{ widget.id }}"
                aria-expanded="true"
                aria-controls="collapse-widget-{{ widget.id }}">
            <span>{{ widget.translated_title }}</span>
            <i class="fas fa-chevron-down TAVATA-collapse-icon"></i>
        </button>
    </h5>

    <div class="collapse show" id="collapse-widget-{{ widget.id }}">
        <div class="card-body">
            <div class="featured-tag-cloud">
                {% for tag in items %}
                    <a href="{{ tag.get_absolute_url }}"
                       class="featured-tag-cloud__item {% if tag.cloud_font_size %}featured-tag-cloud__item--contextual{% else %}featured-tag-cloud__item--{% if tag.recent_clicks >= 10 %}xl{% elif tag.recent_clicks >= 3 %}lg{% else %}md{% endif %}{% endif %}"
                       style="--tag-delay: {{ forloop.counter0 }}; --tag-score: {{ tag.recent_clicks|default:0 }};{% if tag.cloud_font_size %} --tag-cloud-font-size: {{ tag.cloud_font_size }}rem;{% endif %}">
                        {{ tag.label }}
                    </a>
                {% empty %}
                    <span class="text-muted small">{% translate "No featured tags available." %}</span>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
